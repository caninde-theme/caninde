name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build tokens and app targets
        run: npm run build
      - name: Generated files are up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated files are out of date. Run 'npm run build' and commit the result."
            git status --short
            exit 1
          fi
      - name: Contrast check
        run: npm run check
      - name: Tests
        run: npm test

  package-vscode:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Package the VS Code extension
        working-directory: packages/vscode
        run: npx --yes @vscode/vsce package
